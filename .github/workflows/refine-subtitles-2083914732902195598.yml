name: Refine subtitles 2083914732902195598

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Download draft timeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Adieuuuuuu/others/actions/artifacts/8859742052/zip" -o translated.zip
          mkdir translated
          unzip -q translated.zip -d translated
          test -s translated/segments_bilingual.json

      - name: Install local model runner
        run: |
          curl -LsSf https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Refine and validate translations
        run: |
          python -m pip install --quiet requests
          python subtitle_refine_2083914732902195598.py

      - name: Upload refined timeline
        uses: actions/upload-artifact@v4
        with:
          name: refined-bilingual-timeline-2083914732902195598
          path: |
            segments_bilingual_refined.json
            refinement_review.json
            llama-server.log
          if-no-files-found: error
          retention-days: 1
