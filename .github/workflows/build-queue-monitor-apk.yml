name: Build Queue Monitor APK

on:
  pull_request:
    paths:
      - 'queue-monitor-android/**'
      - '.github/workflows/build-queue-monitor-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: queue-monitor-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore generated Java sources
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/adie/queuemonitor

          cat generated/v11/MainActivity.java.gz.b64.part00 \
              generated/v11/MainActivity.java.gz.b64.part01 \
              generated/v11/MainActivity.java.gz.b64.part02 \
              generated/v11/MainActivity.java.gz.b64.part03 \
              > /tmp/MainActivity.java.gz.b64
          base64 --decode /tmp/MainActivity.java.gz.b64 > /tmp/MainActivity.java.gz
          gzip --test /tmp/MainActivity.java.gz
          gzip --decompress --stdout /tmp/MainActivity.java.gz \
              > app/src/main/java/com/adie/queuemonitor/MainActivity.java

          base64 --decode generated/v11/MonitorService.java.gz.b64.part00 \
              > /tmp/MonitorService.java.gz
          gzip --test /tmp/MonitorService.java.gz
          gzip --decompress --stdout /tmp/MonitorService.java.gz \
              > app/src/main/java/com/adie/queuemonitor/MonitorService.java

          test -s app/src/main/java/com/adie/queuemonitor/MainActivity.java
          test -s app/src/main/java/com/adie/queuemonitor/MonitorService.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: queue-monitor-apk
          path: queue-monitor-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
