name: Build bilingual X video 2083914732902195598

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  models: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      POST_ID: "2083914732902195598"
      VIDEO_URL: "https://video.twimg.com/amplify_video/2083307906829590529/vid/avc1/1920x1080/G1aIk6bYe3ZCneYD.mp4?tag=29"
    steps:
      - uses: actions/checkout@v4

      - name: Install media and subtitle dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --quiet --disable-pip-version-check \
            yt-dlp faster-whisper requests deep-translator

      - name: Download and inspect source video
        shell: bash
        run: |
          set -euo pipefail
          yt-dlp --no-playlist --merge-output-format mp4 -o 'source.%(ext)s' "$VIDEO_URL"
          test -s source.mp4
          ffprobe -v error -show_format -show_streams -of json source.mp4 > source_probe.json
          ffmpeg -hide_banner -loglevel error -y -i source.mp4 -vn -ac 1 -ar 16000 -c:a pcm_s16le audio.wav
          sha256sum source.mp4 > source.sha256
          python - <<'PY'
          import json
          import os
          import requests
          from pathlib import Path

          post_id = os.environ["POST_ID"]
          response = requests.get(
              f"https://api.fxtwitter.com/status/{post_id}",
              headers={"User-Agent": "Adie bilingual subtitle job/1.0"},
              timeout=30,
          )
          response.raise_for_status()
          Path("tweet.json").write_text(
              json.dumps(response.json(), ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Transcribe English with timestamps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel

          model_names = [
              "Systran/faster-distil-whisper-large-v3",
              "small.en",
          ]
          last_error = None
          model = None
          selected = None
          for model_name in model_names:
              try:
                  model = WhisperModel(
                      model_name,
                      device="cpu",
                      compute_type="int8",
                      cpu_threads=4,
                      num_workers=1,
                  )
                  selected = model_name
                  break
              except Exception as exc:
                  last_error = exc
          if model is None:
              raise RuntimeError(f"Unable to load a Whisper model: {last_error!r}")

          raw_segments, info = model.transcribe(
              "audio.wav",
              language="en",
              beam_size=5,
              best_of=5,
              vad_filter=True,
              vad_parameters={"min_silence_duration_ms": 450},
              condition_on_previous_text=True,
              temperature=0.0,
              word_timestamps=False,
          )

          segments = []
          for index, segment in enumerate(raw_segments):
              text = " ".join(segment.text.strip().split())
              if not text:
                  continue
              start = max(0.0, float(segment.start))
              end = max(start + 0.08, float(segment.end))
              segments.append({
                  "id": len(segments),
                  "start": round(start, 3),
                  "end": round(end, 3),
                  "en": text,
              })

          if not segments:
              raise RuntimeError("Whisper returned no speech segments")

          Path("segments_en.json").write_text(
              json.dumps(segments, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          Path("transcription_info.json").write_text(
              json.dumps({
                  "model": selected,
                  "language": info.language,
                  "language_probability": info.language_probability,
                  "duration": info.duration,
                  "duration_after_vad": info.duration_after_vad,
                  "segment_count": len(segments),
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          Path("transcript_en.txt").write_text(
              "\n".join(item["en"] for item in segments) + "\n",
              encoding="utf-8",
          )
          print(f"Transcribed {len(segments)} segments with {selected}")
          PY

      - name: Translate subtitles into Simplified Chinese
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path
          import requests

          segments = json.loads(Path("segments_en.json").read_text(encoding="utf-8"))
          token = os.environ["GITHUB_TOKEN"]
          endpoint = "https://models.github.ai/inference/chat/completions"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2026-03-10",
          }
          models = ["openai/gpt-4.1-mini", "openai/gpt-4o-mini", "openai/gpt-4.1"]

          def parse_content(content):
              content = content.strip()
              content = re.sub(r"^```(?:json)?\s*", "", content)
              content = re.sub(r"\s*```$", "", content)
              first = content.find("{")
              last = content.rfind("}")
              if first >= 0 and last > first:
                  content = content[first:last + 1]
              data = json.loads(content)
              items = data.get("translations") if isinstance(data, dict) else data
              if not isinstance(items, list):
                  raise ValueError("Model response does not contain a translations array")
              return items

          def call_model(batch):
              compact = [{"id": item["id"], "en": item["en"]} for item in batch]
              user_prompt = (
                  "Translate every English subtitle below into natural, accurate Simplified Chinese. "
                  "Keep the meaning, names, technical terms, tone, and implied subject. "
                  "Use concise spoken Chinese suitable for on-screen subtitles. "
                  "Do not omit, merge, split, explain, or add information. "
                  "Return only one JSON object in this exact shape: "
                  '{"translations":[{"id":0,"zh":"..."}]}. '
                  "Every input id must appear exactly once. Input:\n" +
                  json.dumps(compact, ensure_ascii=False)
              )
              last_error = None
              for model_name in models:
                  for attempt in range(4):
                      try:
                          response = requests.post(
                              endpoint,
                              headers=headers,
                              json={
                                  "model": model_name,
                                  "temperature": 0.1,
                                  "max_tokens": 12000,
                                  "messages": [
                                      {
                                          "role": "system",
                                          "content": "You are a meticulous professional English-to-Simplified-Chinese subtitle translator. Output valid JSON only."
                                      },
                                      {"role": "user", "content": user_prompt},
                                  ],
                              },
                              timeout=180,
                          )
                          if response.status_code == 429:
                              time.sleep(8 * (attempt + 1))
                              continue
                          response.raise_for_status()
                          content = response.json()["choices"][0]["message"]["content"]
                          translated = parse_content(content)
                          expected = {item["id"] for item in batch}
                          received = {int(item["id"]) for item in translated}
                          if received != expected:
                              raise ValueError(f"ID mismatch: expected {expected}, received {received}")
                          mapping = {int(item["id"]): str(item["zh"]).strip() for item in translated}
                          if any(not mapping[item_id] for item_id in expected):
                              raise ValueError("Empty translated subtitle")
                          return mapping
                      except Exception as exc:
                          last_error = exc
                          time.sleep(4 * (attempt + 1))
              raise RuntimeError(f"GitHub Models translation failed: {last_error!r}")

          batches = []
          current = []
          current_chars = 0
          for segment in segments:
              length = len(segment["en"])
              if current and (len(current) >= 32 or current_chars + length > 8500):
                  batches.append(current)
                  current = []
                  current_chars = 0
              current.append(segment)
              current_chars += length
          if current:
              batches.append(current)

          translations = {}
          for batch_index, batch in enumerate(batches, start=1):
              print(f"Translating batch {batch_index}/{len(batches)} ({len(batch)} segments)")
              translations.update(call_model(batch))
              time.sleep(1)

          output = []
          for segment in segments:
              item = dict(segment)
              item["zh"] = translations[segment["id"]]
              output.append(item)

          Path("segments_bilingual.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Generate bilingual subtitle files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          segments = json.loads(Path("segments_bilingual.json").read_text(encoding="utf-8"))

          def srt_time(seconds):
              milliseconds = int(round(seconds * 1000))
              hours, remainder = divmod(milliseconds, 3_600_000)
              minutes, remainder = divmod(remainder, 60_000)
              secs, millis = divmod(remainder, 1000)
              return f"{hours:02d}:{minutes:02d}:{secs:02d},{millis:03d}"

          def ass_time(seconds):
              centiseconds = int(round(seconds * 100))
              hours, remainder = divmod(centiseconds, 360_000)
              minutes, remainder = divmod(remainder, 6_000)
              secs, centis = divmod(remainder, 100)
              return f"{hours}:{minutes:02d}:{secs:02d}.{centis:02d}"

          def ass_escape(text):
              return (text.replace("\\", "\\\\")
                          .replace("{", "\\{")
                          .replace("}", "\\}")
                          .replace("\n", "\\N"))

          english_srt = []
          bilingual_srt = []
          transcript = []
          dialogues = []
          for index, item in enumerate(segments, start=1):
              start = srt_time(item["start"])
              end = srt_time(item["end"])
              english_srt.extend([str(index), f"{start} --> {end}", item["en"], ""])
              bilingual_srt.extend([str(index), f"{start} --> {end}", item["en"], item["zh"], ""])
              transcript.append(f"[{start[:8]}] {item['en']}\n{item['zh']}\n")
              en = ass_escape(item["en"])
              zh = ass_escape(item["zh"])
              text = (r"{\fnNoto Sans\fs40\c&H00FFFFFF&}" + en +
                      r"\N{\fnNoto Sans CJK SC\fs44\c&H0000D7FF&}" + zh)
              dialogues.append(
                  f"Dialogue: 0,{ass_time(item['start'])},{ass_time(item['end'])},Bilingual,,0,0,0,,{text}"
              )

          ass_header = """[Script Info]
          Title: English and Simplified Chinese bilingual subtitles
          ScriptType: v4.00+
          PlayResX: 1920
          PlayResY: 1080
          WrapStyle: 0
          ScaledBorderAndShadow: yes
          YCbCr Matrix: TV.709

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Bilingual,Noto Sans CJK SC,42,&H00FFFFFF,&H00FFFFFF,&H00000000,&H78000000,-1,0,0,0,100,100,0,0,1,3.2,1.2,2,90,90,62,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """
          ass_header = "\n".join(line.strip() for line in ass_header.splitlines()) + "\n"

          Path("english.srt").write_text("\n".join(english_srt), encoding="utf-8")
          Path("bilingual.srt").write_text("\n".join(bilingual_srt), encoding="utf-8")
          Path("bilingual.ass").write_text(ass_header + "\n".join(dialogues) + "\n", encoding="utf-8")
          Path("transcript_bilingual.txt").write_text("\n".join(transcript), encoding="utf-8")

          chinese_count = len(re.findall(r"[\u4e00-\u9fff]", Path("bilingual.ass").read_text(encoding="utf-8")))
          if chinese_count < max(20, len(segments) // 2):
              raise RuntimeError("Chinese subtitle validation failed")
          PY

      - name: Burn subtitles into video
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel warning -y \
            -i source.mp4 \
            -vf "ass=bilingual.ass" \
            -c:v libx264 -preset fast -crf 22 -pix_fmt yuv420p \
            -c:a copy -movflags +faststart \
            x_video_2083914732902195598_en_zh_subtitled.mp4
          test -s x_video_2083914732902195598_en_zh_subtitled.mp4
          ffprobe -v error -show_format -show_streams -of json \
            x_video_2083914732902195598_en_zh_subtitled.mp4 > output_probe.json
          sha256sum x_video_2083914732902195598_en_zh_subtitled.mp4 > output.sha256

          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("source_probe.json").read_text())
          output = json.loads(Path("output_probe.json").read_text())
          source_duration = float(source["format"]["duration"])
          output_duration = float(output["format"]["duration"])
          if abs(source_duration - output_duration) > 0.75:
              raise RuntimeError(f"Duration mismatch: source={source_duration}, output={output_duration}")
          if not any(stream.get("codec_type") == "video" for stream in output["streams"]):
              raise RuntimeError("Output has no video stream")
          if not any(stream.get("codec_type") == "audio" for stream in output["streams"]):
              raise RuntimeError("Output has no audio stream")
          Path("validation.json").write_text(
              json.dumps({
                  "source_duration": source_duration,
                  "output_duration": output_duration,
                  "duration_difference": abs(source_duration - output_duration),
                  "segment_count": len(json.loads(Path("segments_bilingual.json").read_text(encoding="utf-8"))),
                  "output_bytes": Path("x_video_2083914732902195598_en_zh_subtitled.mp4").stat().st_size,
              }, indent=2),
              encoding="utf-8",
          )
          PY

          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 source.mp4)"
          for FRACTION in 0.18 0.50 0.82; do
            TIME="$(python -c "print(float('$DURATION') * float('$FRACTION'))")"
            LABEL="$(echo "$FRACTION" | tr -d '.')"
            ffmpeg -hide_banner -loglevel error -y -ss "$TIME" \
              -i x_video_2083914732902195598_en_zh_subtitled.mp4 \
              -frames:v 1 "preview_${LABEL}.jpg"
          done

      - name: Upload finished bilingual video
        uses: actions/upload-artifact@v4
        with:
          name: x-video-2083914732902195598-en-zh-subtitled
          path: |
            x_video_2083914732902195598_en_zh_subtitled.mp4
            bilingual.ass
            bilingual.srt
            english.srt
            transcript_bilingual.txt
            segments_bilingual.json
            transcription_info.json
            tweet.json
            source_probe.json
            output_probe.json
            validation.json
            source.sha256
            output.sha256
            preview_*.jpg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: x-video-2083914732902195598-diagnostics
          path: |
            *.json
            *.txt
            *.srt
            *.ass
            *.sha256
          if-no-files-found: ignore
          retention-days: 1
