name: Refine bilingual subtitles with local Qwen 2083914732902195598

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Download initial bilingual timeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Adieuuuuuu/others/actions/artifacts/8859742052/zip" \
            -o translated.zip
          mkdir translated
          unzip -q translated.zip -d translated
          test -s translated/segments_bilingual.json

      - name: Install and start local translation editor
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://llama.app/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          command -v llama-server
          nohup llama-server \
            -hf Qwen/Qwen2.5-3B-Instruct-GGUF:Q4_K_M \
            --host 127.0.0.1 \
            --port 8080 \
            -c 16384 \
            -np 1 \
            -t 4 \
            > llama-server.log 2>&1 &
          echo $! > llama-server.pid
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "Local Qwen server ready"
              exit 0
            fi
            sleep 5
          done
          tail -n 200 llama-server.log
          exit 1

      - name: Refine every Chinese subtitle with adjacent context
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check requests
          python - <<'PY'
          import json
          import re
          import time
          from pathlib import Path
          import requests

          input_path = Path('translated/segments_bilingual.json')
          segments = json.loads(input_path.read_text(encoding='utf-8'))
          endpoint = 'http://127.0.0.1:8080/v1/chat/completions'

          system = '''You are a meticulous subtitle editor and English-to-Simplified-Chinese translator. The source is a Stanford CS153 interview with Sam Altman about startups, OpenAI, AI scaling, ChatGPT, Codex, inference, compute, AGI, economics, and education.

Rewrite each Chinese subtitle so it is natural, concise, and faithful. Adjacent subtitle entries often form one sentence, so use the surrounding entries to resolve fragments, pronouns, and continuity. Keep every subtitle entry separate because its timing is fixed. Never merge, omit, renumber, or add entries. Do not translate names or technical terms incorrectly.

Required terminology:
OpenAI; ChatGPT; Codex; GPT-3; GPT-4; GPT-5.5; AGI; AI; LLM/LLMs; token; API; RL; GPU/GPUs; A100; H100; Blackwell; Y Combinator/YC; Cloudflare; Stanford; CS153; Yann LeCun; Erdős 问题; Nicolai Tangen; 挪威主权财富基金; 一人前沿实验室; 预训练; 中期训练; 后训练; 推理算力.

Use “智能” for intelligence in the AI sense, use “token” rather than “代币”, and use “公用事业/基础服务” rather than software “实用程序” when utility means electricity-like infrastructure.
Return valid JSON only, exactly in this shape: {"translations":[{"id":123,"zh":"..."}]}.'''

          def parse_json(text):
              text = text.strip()
              text = re.sub(r'^```(?:json)?\s*', '', text)
              text = re.sub(r'\s*```$', '', text)
              start = text.find('{')
              end = text.rfind('}')
              if start < 0 or end <= start:
                  raise ValueError('No JSON object found')
              obj = json.loads(text[start:end+1])
              items = obj.get('translations')
              if not isinstance(items, list):
                  raise ValueError('Missing translations array')
              return {int(item['id']): str(item['zh']).strip() for item in items}

          def call_model(target_batch, context_before, context_after, attempt):
              payload_items = []
              for item in context_before:
                  payload_items.append({'id': item['id'], 'role': 'context_before', 'en': item['en'], 'draft_zh': item['zh']})
              for item in target_batch:
                  payload_items.append({'id': item['id'], 'role': 'translate', 'en': item['en'], 'draft_zh': item['zh']})
              for item in context_after:
                  payload_items.append({'id': item['id'], 'role': 'context_after', 'en': item['en'], 'draft_zh': item['zh']})

              target_ids = [item['id'] for item in target_batch]
              prompt = (
                  'Only output translations for role="translate" IDs, in this exact order: ' +
                  json.dumps(target_ids) + '. Context entries are reference only.\n\nINPUT:\n' +
                  json.dumps(payload_items, ensure_ascii=False)
              )
              response = requests.post(
                  endpoint,
                  json={
                      'model': 'Qwen2.5-3B-Instruct',
                      'messages': [
                          {'role': 'system', 'content': system},
                          {'role': 'user', 'content': prompt},
                      ],
                      'temperature': 0.05 if attempt == 0 else 0.0,
                      'max_tokens': 3000,
                      'seed': 20260803 + target_batch[0]['id'] + attempt,
                      'response_format': {'type': 'json_object'},
                  },
                  timeout=600,
              )
              response.raise_for_status()
              content = response.json()['choices'][0]['message']['content']
              return parse_json(content)

          refined = {}
          batch_size = 20
          total_batches = (len(segments) + batch_size - 1) // batch_size
          for batch_no, start in enumerate(range(0, len(segments), batch_size), start=1):
              target = segments[start:start+batch_size]
              before = segments[max(0, start-2):start]
              after = segments[start+batch_size:start+batch_size+2]
              expected = {item['id'] for item in target}
              result = None
              last_error = None
              for attempt in range(3):
                  try:
                      candidate = call_model(target, before, after, attempt)
                      if set(candidate) != expected:
                          raise ValueError(f'ID mismatch expected={sorted(expected)} got={sorted(candidate)}')
                      if any(not candidate[item_id] for item_id in expected):
                          raise ValueError('Empty translation')
                      result = candidate
                      break
                  except Exception as exc:
                      last_error = exc
                      time.sleep(3 * (attempt + 1))
              if result is None:
                  print(f'Batch {batch_no} failed after retries: {last_error!r}; retaining draft translations')
                  result = {item['id']: item['zh'] for item in target}
              refined.update(result)
              print(f'Refined batch {batch_no}/{total_batches}; segments={len(refined)}/{len(segments)}')

          cleanup = [
              ('法学硕士', 'LLM'),
              ('大型语言模型', '大语言模型'),
              ('代币', 'token'),
              ('开放人工智能', 'OpenAI'),
              ('开放AI', 'OpenAI'),
              ('聊天GPT', 'ChatGPT'),
              ('代码索引', 'Codex'),
              ('科德克斯', 'Codex'),
              ('埃尔多斯问题', 'Erdős 问题'),
              ('厄尔多斯问题', 'Erdős 问题'),
              ('扬·勒昆', 'Yann LeCun'),
              ('杨立昆', 'Yann LeCun'),
          ]

          output = []
          fallback_count = 0
          for item in segments:
              zh = refined.get(item['id'], item['zh'])
              if item['id'] not in refined:
                  fallback_count += 1
              for wrong, right in cleanup:
                  zh = zh.replace(wrong, right)
              zh = re.sub(r'\s+', ' ', zh).strip()
              output.append({**item, 'zh': zh})

          forbidden = ['法学硕士', '开放人工智能', '聊天GPT', '代码索引']
          bad = [(item['id'], word) for item in output for word in forbidden if word in item['zh']]
          if bad:
              raise RuntimeError(f'Forbidden mistranslations remain: {bad[:20]}')
          if len(output) != 509:
              raise RuntimeError(f'Expected 509 segments, got {len(output)}')
          chinese_chars = sum(len(re.findall(r'[\u4e00-\u9fff]', item['zh'])) for item in output)
          if chinese_chars < 6500:
              raise RuntimeError(f'Too few Chinese characters: {chinese_chars}')

          Path('segments_bilingual_refined.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2), encoding='utf-8')
          review_ids = [0,1,2,3,14,15,17,18,19,133,145,187,189,196,210,259,260,263,266,272,292,318,323,451,477,481,490,491,499,507,508]
          samples = [output[i] for i in review_ids]
          Path('refinement_review.json').write_text(
              json.dumps({
                  'model': 'Qwen2.5-3B-Instruct-GGUF Q4_K_M',
                  'segment_count': len(output),
                  'chinese_characters': chinese_chars,
                  'fallback_count': fallback_count,
                  'samples': samples,
              }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload refined bilingual timeline
        uses: actions/upload-artifact@v4
        with:
          name: refined-bilingual-timeline-2083914732902195598
          path: |
            segments_bilingual_refined.json
            refinement_review.json
            llama-server.log
          if-no-files-found: error
          retention-days: 1
