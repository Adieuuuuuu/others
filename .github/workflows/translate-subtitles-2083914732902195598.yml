name: Translate subtitles 2083914732902195598

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download completed English timeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Adieuuuuuu/others/actions/artifacts/8859401800/zip" \
            -o diagnostics.zip
          mkdir diagnostics
          unzip -q diagnostics.zip -d diagnostics
          test -s diagnostics/segments_en.json

      - name: Translate and validate all subtitle segments
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check requests
          python - <<'PY'
          import concurrent.futures
          import json
          import random
          import re
          import threading
          import time
          from pathlib import Path
          import requests

          source = json.loads(Path('diagnostics/segments_en.json').read_text(encoding='utf-8'))

          replacements = [
              (r'\bopening AI\b', 'OpenAI'),
              (r'\bopen[- ]AI\b', 'OpenAI'),
              (r'\bchat GPUT\b', 'ChatGPT'),
              (r'\bChatGBTBT\b', 'ChatGPT'),
              (r'\bChatGBT\b', 'ChatGPT'),
              (r'\bChatsypti\b', 'ChatGPT'),
              (r'\bGPT3\b', 'GPT-3'),
              (r'\bGPT4\b', 'GPT-4'),
              (r'\bLLM\'s\b', 'LLMs'),
              (r'\bJan Lecun\b', 'Yann LeCun'),
              (r'\bLekun\b', 'LeCun'),
              (r'\bErdish problems\b', 'Erdős problems'),
              (r'\bNicolite engine\b', 'Nicolai Tangen'),
              (r'\bCardi 5x103\b', 'our CS153 course'),
              (r'\bH-100s\b', 'H100s'),
              (r'\bH-100\b', 'H100'),
          ]

          def clean_english(text):
              text = ' '.join(text.split())
              for pattern, replacement in replacements:
                  text = re.sub(pattern, replacement, text, flags=re.IGNORECASE)
              text = text.replace('codex', 'Codex')
              text = re.sub(r'\bopenai\b', 'OpenAI', text, flags=re.IGNORECASE)
              return text

          for item in source:
              item['en'] = clean_english(item['en'])

          endpoints = [
              'https://translate.googleapis.com/translate_a/single',
              'https://translate.google.com/translate_a/single',
          ]
          thread_local = threading.local()

          def get_session():
              session = getattr(thread_local, 'session', None)
              if session is None:
                  session = requests.Session()
                  session.headers.update({
                      'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
                  })
                  thread_local.session = session
              return session

          def translate_one(item):
              text = item['en']
              last_error = None
              for attempt in range(10):
                  endpoint = endpoints[attempt % len(endpoints)]
                  try:
                      response = get_session().get(
                          endpoint,
                          params={
                              'client': 'gtx',
                              'sl': 'en',
                              'tl': 'zh-CN',
                              'dt': 't',
                              'q': text,
                          },
                          timeout=45,
                      )
                      if response.status_code in (429, 503):
                          raise RuntimeError(f'transient HTTP {response.status_code}')
                      response.raise_for_status()
                      payload = response.json()
                      translated = ''.join(
                          part[0] for part in payload[0]
                          if isinstance(part, list) and part and part[0]
                      ).strip()
                      if not translated or translated == text:
                          raise RuntimeError('empty or untranslated response')
                      return item['id'], translated
                  except Exception as exc:
                      last_error = exc
                      time.sleep(min(30, 1.5 * (attempt + 1)) + random.random())
              raise RuntimeError(f"Segment {item['id']} failed: {last_error!r}")

          translations = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              futures = {executor.submit(translate_one, item): item['id'] for item in source}
              completed = 0
              for future in concurrent.futures.as_completed(futures):
                  item_id, zh = future.result()
                  translations[item_id] = zh
                  completed += 1
                  if completed % 25 == 0 or completed == len(source):
                      print(f'Translated {completed}/{len(source)}')

          glossary = {
              '开放人工智能': 'OpenAI',
              '开放AI': 'OpenAI',
              '聊天GPT': 'ChatGPT',
              '聊天 G P T': 'ChatGPT',
              '代码索引': 'Codex',
              '科德克斯': 'Codex',
              'Y 组合器': 'Y Combinator',
              'YC公司': 'YC',
              '扬·勒昆': 'Yann LeCun',
              '杨立昆': 'Yann LeCun',
              '埃尔迪什问题': 'Erdős 问题',
              '尼古拉发动机': 'Nicolai Tangen',
              '尼古拉·坦根': 'Nicolai Tangen',
              '云耀斑': 'Cloudflare',
          }

          output = []
          for item in source:
              zh = translations[item['id']]
              for wrong, right in glossary.items():
                  zh = zh.replace(wrong, right)
              zh = re.sub(r'\s+', ' ', zh).strip()
              output.append({
                  'id': item['id'],
                  'start': item['start'],
                  'end': item['end'],
                  'en': item['en'],
                  'zh': zh,
              })

          if len(output) != len(source):
              raise RuntimeError('Subtitle count mismatch')
          if any(not item['zh'] for item in output):
              raise RuntimeError('Empty Chinese subtitle found')
          chinese_chars = sum(len(re.findall(r'[\u4e00-\u9fff]', item['zh'])) for item in output)
          if chinese_chars < 4000:
              raise RuntimeError(f'Too few Chinese characters: {chinese_chars}')

          Path('segments_bilingual.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('translation_validation.json').write_text(
              json.dumps({
                  'segment_count': len(output),
                  'chinese_characters': chinese_chars,
                  'first': output[0],
                  'middle': output[len(output)//2],
                  'last': output[-1],
              }, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Validation passed: {len(output)} segments, {chinese_chars} Chinese characters')
          PY

      - name: Upload translated timeline
        uses: actions/upload-artifact@v4
        with:
          name: translated-timeline-2083914732902195598
          path: |
            segments_bilingual.json
            translation_validation.json
          if-no-files-found: error
          retention-days: 1
