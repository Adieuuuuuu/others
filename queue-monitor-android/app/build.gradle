plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adie.queuemonitor'
    compileSdk 36

    defaultConfig {
        applicationId 'com.adie.queuemonitor'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
